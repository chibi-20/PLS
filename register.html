<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Registration</title>
 <link rel="stylesheet" href="public/styles.css">
  <style>
    #sections-container {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 20px;
      margin-top: 5px;
    }
    .section-checkbox {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: normal;
    }
  </style>
</head>
<body>


  <div class="container">
    <h1>Create Account</h1>
    <div id="message" style="display:none; padding:10px; margin:10px 0; border-radius:4px;"></div>
    <form id="register-form">
      
      <label for="fullname">Full Name</label>
      <input type="text" id="fullname" name="fullname" required>

      <label for="username">Username</label>
      <input type="text" id="username" name="username" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>

      <label for="subject">Subject Taught</label>
        <select id="subject" name="subject" required>
          <option value="">-- Select Subject --</option>
          <option value="Filipino">Filipino</option>
          <option value="English">English</option>
          <option value="Math">Math</option>
          <option value="Science">Science</option>
          <option value="Araling Panlipunan">Araling Panlipunan</option>
          <option value="Edukasyon sa Pagpapakatao">Edukasyon sa Pagpapakatao</option>
          <option value="Technology and Livelihood Education">Technology and Livelihood Education</option>
          <option value="MAPEH">MAPEH</option>
        </select>

      <label for="gradeLevel">Grade Level</label>
        <select id="gradeLevel" name="gradeLevel" required>
          <option value="">-- Select Grade Level --</option>
          <option value="Grade 7">Grade 7</option>
          <option value="Grade 8">Grade 8</option>
          <option value="Grade 9">Grade 9</option>
          <option value="Grade 10">Grade 10</option>
        </select>

      <label>Sections</label>
      <div id="sections-container">
        <p style="color:#666; font-style: italic;">Select a grade level to see its sections.</p>
      </div>

      <button type="submit" style="margin-top:20px;">Register</button>
    </form>

    <p>Already have an account? <a href="index.html">Login</a></p>
  </div>

  <script>
    const sectionsContainer = document.getElementById('sections-container');
    const gradeLevelSelect = document.getElementById('gradeLevel');
    const registerForm = document.getElementById('register-form');
    const messageDiv = document.getElementById('message');

    // Load the canonical sections for the chosen grade level as checkboxes
    gradeLevelSelect.addEventListener('change', async () => {
      const gradeLevel = gradeLevelSelect.value;

      if (!gradeLevel) {
        sectionsContainer.innerHTML = '<p style="color:#666; font-style: italic;">Select a grade level to see its sections.</p>';
        return;
      }

      sectionsContainer.innerHTML = '<p style="color:#666; font-style: italic;">Loading sections...</p>';

      try {
        const response = await fetch(`backend/get_sections_by_grade.php?grade_level=${encodeURIComponent(gradeLevel)}`);
        const result = await response.json();

        if (!result.success || result.sections.length === 0) {
          sectionsContainer.innerHTML = '<p style="color:#c0392b;">No sections available yet for this grade level. Contact your admin.</p>';
          return;
        }

        sectionsContainer.innerHTML = result.sections.map(section => `
          <label class="section-checkbox">
            <input type="checkbox" name="section_ids[]" value="${section.id}">
            ${section.section_name}
          </label>
        `).join('');
      } catch (error) {
        console.error('Error loading sections:', error);
        sectionsContainer.innerHTML = '<p style="color:#c0392b;">Error loading sections. Please try again.</p>';
      }
    });

    // Handle form submission
    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      if (!sectionsContainer.querySelector('input[name="section_ids[]"]:checked')) {
        messageDiv.style.display = 'block';
        messageDiv.style.backgroundColor = '#f8d7da';
        messageDiv.style.color = '#721c24';
        messageDiv.style.border = '1px solid #f5c6cb';
        messageDiv.textContent = 'Please select at least one section.';
        return;
      }

      const formData = new FormData(registerForm);

      try {
        const response = await fetch('backend/register.php', {
          method: 'POST',
          body: formData
        });
        
        const result = await response.json();
        
        if (result.success) {
          messageDiv.style.display = 'block';
          messageDiv.style.backgroundColor = '#d4edda';
          messageDiv.style.color = '#155724';
          messageDiv.style.border = '1px solid #c3e6cb';
          messageDiv.textContent = result.message + ' Redirecting to login page...';
          
          // Redirect to login page after successful registration
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 2000);
        } else {
          messageDiv.style.display = 'block';
          messageDiv.style.backgroundColor = '#f8d7da';
          messageDiv.style.color = '#721c24';
          messageDiv.style.border = '1px solid #f5c6cb';
          messageDiv.textContent = result.message;
        }
      } catch (error) {
        messageDiv.style.display = 'block';
        messageDiv.style.backgroundColor = '#f8d7da';
        messageDiv.style.color = '#721c24';
        messageDiv.style.border = '1px solid #f5c6cb';
        messageDiv.textContent = 'An error occurred during registration. Please try again.';
        console.error('Registration error:', error);
      }
    });
  </script>

</body>
</html>
